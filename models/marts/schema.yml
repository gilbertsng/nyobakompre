version: 2

models:
  - name: fct_customer_transactions
    description: "Tabel fakta transaksi perbankan dengan atribut nasabah dan akun."
    columns:
      - name: transaction_id
        description: "Primary key transaksi."
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: dim_customers
    description: "Tabel dimensi nasabah beserta ringkasan aktivitas transaksi dan saldo kas."
    columns:
      - name: customer_id
        description: "Primary key nasabah."
        tests:
          - unique
          - not_null
      - name: total_accounts
        tests:
          - not_null
